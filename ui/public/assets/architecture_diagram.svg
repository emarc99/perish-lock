<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 700" style="background:#090d16;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0b1120"/><stop offset="50%" stop-color="#090d16"/><stop offset="100%" stop-color="#06080e"/></linearGradient><linearGradient id="accentCyan" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="100%" stop-color="#0284c7"/></linearGradient><linearGradient id="accentPurple" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#a855f7"/><stop offset="100%" stop-color="#7e22ce"/></linearGradient><linearGradient id="accentAmber" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#f59e0b"/><stop offset="100%" stop-color="#d97706"/></linearGradient><linearGradient id="accentEmerald" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#10b981"/><stop offset="100%" stop-color="#059669"/></linearGradient><linearGradient id="cardBg" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="rgba(30, 41, 59, 0.75)"/><stop offset="100%" stop-color="rgba(15, 23, 42, 0.85)"/></linearGradient><filter id="glowCyan" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="6"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter></defs><rect width="1200" height="700" fill="url(#bgGrad)"/><g transform="translate(60, 40)"><rect width="1080" height="70" x="0" y="0" fill="url(#cardBg)" stroke="#1e293b" stroke-width="1.5" rx="14"/><circle cx="35" cy="35" r="14" fill="#0284c7" opacity=".2"/><circle cx="35" cy="35" r="7" fill="#38bdf8"/><text x="65" y="36" fill="#f8fafc" font-size="20" font-weight="700" letter-spacing=".5">PERISHLOCK ARCHITECTURE — AUTONOMOUS COLD-CHAIN DEFENSE</text><text x="65" y="54" fill="#94a3b8" font-size="12">AWS Strands Agents SDK • Amazon Bedrock AgentCore • Parametric Salvage Protocol</text><rect width="145" height="30" x="910" y="20" fill="rgba(56, 189, 248, 0.15)" stroke="#38bdf8" stroke-width="1" rx="15"/><text x="982" y="40" fill="#38bdf8" font-size="11" font-weight="600" text-anchor="middle">GOOD NEIGHBOR TRACK</text></g><g transform="translate(60, 130)"><rect width="310" height="520" x="0" y="0" fill="url(#cardBg)" stroke="#1e293b" stroke-width="1.5" rx="16"/><rect width="310" height="42" x="0" y="0" fill="#0f172a" stroke="#1e293b" stroke-width="1" rx="16"/><text x="20" y="27" fill="#38bdf8" font-size="14" font-weight="700">1. SENSORS &amp; TELEMETRY</text><rect width="270" height="85" x="20" y="60" fill="#1e293b" stroke="#334155" stroke-width="1" rx="10"/><text x="35" y="86" fill="#f8fafc" font-size="13" font-weight="600">Dual IoT Chamber Probes</text><text x="35" y="105" fill="#94a3b8" font-size="11">Sensor 1 (AHT20) + Sensor 2 (SHT31)</text><text x="35" y="125" fill="#38bdf8" font-size="11">15-min Telemetry Stream (T, RH%)</text><rect width="270" height="85" x="20" y="160" fill="#1e293b" stroke="#334155" stroke-width="1" rx="10"/><text x="35" y="186" fill="#f8fafc" font-size="13" font-weight="600">Deterministic Validator</text><text x="35" y="205" fill="#94a3b8" font-size="11">Dual-sensor drift check (|ΔT| ≤ 1.5°C)</text><text x="35" y="225" fill="#10b981" font-size="11">Corrupted outlier rejection</text><rect width="270" height="85" x="20" y="260" fill="#1e293b" stroke="#334155" stroke-width="1" rx="10"/><text x="35" y="286" fill="#f8fafc" font-size="13" font-weight="600">Parametric Trigger Engine</text><text x="35" y="305" fill="#94a3b8" font-size="11">Breach window: &gt; 13.0°C for ≥ 240 min</text><text x="35" y="325" fill="#f59e0b" font-size="11">Zero-adjuster parametric trigger</text><rect width="270" height="135" x="20" y="360" fill="#0f172a" stroke="#0284c7" stroke-width="1.5" rx="10"/><text x="35" y="386" fill="#38bdf8" font-size="13" font-weight="700">Mission Control Web UI</text><text x="35" y="406" fill="#94a3b8" font-size="11">• Real-time Chart.js telemetry</text><text x="35" y="424" fill="#94a3b8" font-size="11">• Multi-destination salvage trade-offs</text><text x="35" y="442" fill="#94a3b8" font-size="11">• Single-use cryptographic approval</text><text x="35" y="460" fill="#94a3b8" font-size="11">• SHA-256 Merkle manifest inspector</text></g><g transform="translate(395, 130)"><rect width="410" height="520" x="0" y="0" fill="url(#cardBg)" stroke="#0284c7" stroke-width="2" rx="16"/><rect width="410" height="42" x="0" y="0" fill="#0369a1" fill-opacity=".3" stroke="#0284c7" stroke-width="1" rx="16"/><text x="20" y="27" fill="#38bdf8" font-size="14" font-weight="700">2. AWS STRANDS AGENT HARNESS (COGNITIVE CORE)</text><rect width="370" height="105" x="20" y="55" fill="#1e293b" stroke="#334155" stroke-width="1" rx="10"/><text x="35" y="78" fill="#f8fafc" font-size="13" font-weight="600">11 Typed Tools (@tool)</text><text x="35" y="98" fill="#94a3b8" font-size="11">load_scope • get_sensor_evidence • calculate_route_matrix</text><text x="35" y="116" fill="#94a3b8" font-size="11">prepare_response_options • seal_incident_packet</text><text x="35" y="134" fill="#94a3b8" font-size="11">draft_claim_notice • request_coordinator_approval • dispatch</text><rect width="370" height="95" x="20" y="170" fill="#1e293b" stroke="#334155" stroke-width="1" rx="10"/><text x="35" y="193" fill="#f8fafc" font-size="13" font-weight="600">Deterministic Hooks (HookProvider)</text><text x="35" y="213" fill="#38bdf8" font-size="11">RateLimiterHook : Enforces max 25 calls/turn limit</text><text x="35" y="231" fill="#ef4444" font-size="11">ColdRoomSafetyHook : Intercepts unapproved dispatch</text><text x="35" y="249" fill="#94a3b8" font-size="10">Registers BeforeInvocationEvent &amp; BeforeToolCallEvent</text><rect width="370" height="95" x="20" y="275" fill="#1e293b" stroke="#334155" stroke-width="1" rx="10"/><text x="35" y="298" fill="#f8fafc" font-size="13" font-weight="600">Steering Handlers (SteeringHandler)</text><text x="35" y="318" fill="#a855f7" font-size="11">DispatchApprovalGate : Checks LedgerProvider for approval</text><text x="35" y="336" fill="#10b981" font-size="11">FarmerEmpathyTone : Steers tone against blaming farmers</text><text x="35" y="354" fill="#94a3b8" font-size="10">Issues Proceed() or Guide() actions dynamically</text><rect width="370" height="80" x="20" y="380" fill="#1e293b" stroke="#334155" stroke-width="1" rx="10"/><text x="35" y="403" fill="#f8fafc" font-size="13" font-weight="600">AgentSkills (On-Demand Context)</text><text x="35" y="423" fill="#f59e0b" font-size="11">fresh-tomatoes/SKILL.md : Biological decay formulas</text><text x="35" y="441" fill="#94a3b8" font-size="11">Prevents prompt bloating; loaded only during breach</text><rect width="370" height="38" x="20" y="470" fill="#0f172a" stroke="#38bdf8" stroke-width="1" rx="8"/><text x="205" y="494" fill="#38bdf8" font-size="11" font-weight="600" text-anchor="middle">Amazon Bedrock: Amazon Nova Pro / Claude 3.5 Sonnet</text></g><g transform="translate(830, 130)"><rect width="310" height="520" x="0" y="0" fill="url(#cardBg)" stroke="#1e293b" stroke-width="1.5" rx="16"/><rect width="310" height="42" x="0" y="0" fill="#0f172a" stroke="#1e293b" stroke-width="1" rx="16"/><text x="20" y="27" fill="#a855f7" font-size="14" font-weight="700">3. BEDROCK AGENTCORE &amp; VAULT</text><rect width="270" height="85" x="20" y="60" fill="#1e293b" stroke="#334155" stroke-width="1" rx="10"/><text x="35" y="86" fill="#f8fafc" font-size="13" font-weight="600">Bedrock AgentCore Runtime</text><text x="35" y="105" fill="#a855f7" font-size="11">Managed microVM isolation &amp; VPC link</text><text x="35" y="125" fill="#94a3b8" font-size="11">AgentCore Gateway : 600 RPM throttle</text><rect width="270" height="85" x="20" y="160" fill="#1e293b" stroke="#334155" stroke-width="1" rx="10"/><text x="35" y="186" fill="#f8fafc" font-size="13" font-weight="600">Bedrock AgentCore Memory</text><text x="35" y="205" fill="#94a3b8" font-size="11">Cross-session cooperative memory</text><text x="35" y="225" fill="#38bdf8" font-size="11">Retains partner dock schedules &amp; quotes</text><rect width="270" height="110" x="20" y="260" fill="#1e293b" stroke="#10b981" stroke-width="1.5" rx="10"/><text x="35" y="286" fill="#10b981" font-size="13" font-weight="700">Immutable Evidence Vault</text><text x="35" y="306" fill="#f8fafc" font-size="11">SHA-256 Merkle Evidence Manifest</text><text x="35" y="324" fill="#94a3b8" font-size="11">• Telemetry timeseries hash</text><text x="35" y="342" fill="#94a3b8" font-size="11">• Trigger evaluation hash</text><text x="35" y="360" fill="#94a3b8" font-size="11">• AWS S3 Object Lock (Compliance mode)</text><rect width="270" height="110" x="20" y="385" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" rx="10"/><text x="35" y="411" fill="#f59e0b" font-size="13" font-weight="700">Cryptographic HITL Gate</text><text x="35" y="431" fill="#f8fafc" font-size="11">Single-use HMAC-SHA256 Token</text><text x="35" y="449" fill="#94a3b8" font-size="11">Strict anti-replay prevention</text><text x="35" y="467" fill="#94a3b8" font-size="11">Execution pauses until Human Approves</text></g><line x1="370" x2="395" y1="200" y2="200" stroke="#38bdf8" stroke-dasharray="4 4" stroke-width="2.5"/><polygon fill="#38bdf8" points="395 200 388 196 388 204"/><line x1="370" x2="395" y1="300" y2="300" stroke="#f59e0b" stroke-width="2.5"/><polygon fill="#f59e0b" points="395 300 388 296 388 304"/><line x1="805" x2="830" y1="200" y2="200" stroke="#a855f7" stroke-width="2.5"/><polygon fill="#a855f7" points="830 200 823 196 823 204"/><line x1="805" x2="830" y1="315" y2="315" stroke="#10b981" stroke-dasharray="4 4" stroke-width="2.5"/><polygon fill="#10b981" points="830 315 823 311 823 319"/><line x1="805" x2="830" y1="440" y2="440" stroke="#f59e0b" stroke-width="2.5"/><polygon fill="#f59e0b" points="830 440 823 436 823 444"/><g><text x="540" y="15" fill="#64748b" font-size="11" text-anchor="middle" transform="translate(60, 660)">Built for the AWS Agents for Humans Hackathon 2026 • Open Source under Apache 2.0 License • Verified with 22 Adversarial Test Suites</text></g></svg>